#!/usr/sbin/nft -f
# Le-Jet analysis VM local firewall (WEB_INSPECTION_PLAN.md section 11.4)
# Second layer of defense. Does not replace the gateway filter.
flush ruleset

table inet lejet_an {
  set private4 {
    type ipv4_addr; flags interval
    elements = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8,
                 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16,
                 198.18.0.0/15, 224.0.0.0/3 }
  }

  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iifname "lo" accept
    # SSH only from the gateway
    ip saddr 10.77.0.1 tcp dport 22 accept
  }

  chain output {
    type filter hook output priority 0; policy drop;
    ct state established,related accept
    oifname "lo" accept
    # DNS and time from the gateway only
    ip daddr 10.77.0.1 udp dport { 53, 123 } accept
    ip daddr 10.77.0.1 tcp dport 53 accept
    # Never reach private/reserved space
    ip daddr @private4 counter drop
    # Web only
    tcp dport { 80, 443 } accept
  }
}
