# Le-Jet gateway DNS resolver (WEB_INSPECTION_PLAN.md section 10.6)
# Install as /etc/unbound/unbound.conf.d/lejet.conf
server:
  interface: 10.77.0.1
  interface: 127.0.0.1
  # Bind even if 10.77.0.1 is not up yet at boot (small safety addition to the plan)
  ip-freebind: yes
  access-control: 0.0.0.0/0 refuse
  access-control: 127.0.0.0/8 allow
  access-control: 10.77.0.2/32 allow
  do-ip6: no
  do-udp: yes
  do-tcp: yes
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  aggressive-nsec: yes
  tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt
  # DNS-rebinding protection: drop answers pointing to private space
  private-address: 10.0.0.0/8
  private-address: 100.64.0.0/10
  private-address: 127.0.0.0/8
  private-address: 169.254.0.0/16
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  # Log every query for auditing and liveness stats
  use-syslog: yes
  log-queries: yes
  log-replies: yes
  log-tag-queryreply: yes
  verbosity: 1

forward-zone:
  name: "."
  forward-tls-upstream: yes
  # NON-FILTERING upstreams on purpose (a threat-filtering resolver would make live phishing look dead)
  forward-addr: 1.1.1.1@853#cloudflare-dns.com
  forward-addr: 1.0.0.1@853#cloudflare-dns.com
